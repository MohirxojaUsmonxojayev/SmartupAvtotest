name: Autotest

# Ishga tushirish:
#  • repository_dispatch (type: autotest) — Telegram bot shu orqali yuboradi.
#    Parol client_payload ichida ketadi => Actions UI'da KO'RINMAYDI (public repo xavfsiz).
#  • workflow_dispatch — qo'lda, faqat DEFAULT login/parol bilan (parol inputi yo'q).
#
# run-name server + login'ni ko'rsatadi — bot per-login konfliktni shu nom orqali aniqlaydi.
run-name: "Autotest · ${{ github.event.inputs.server || github.event.client_payload.server }} · ${{ github.event.client_payload.login || 'default' }}"

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server (default login/parol bilan)"
        required: true
        default: online
        type: choice
        options: [online, xtrade]
      chat_id:
        description: "Natija yuboriladigan Telegram chat_id (bo'sh = default secret)"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [autotest]

env:
  # Progress/natija xabarlari uchun umumiy qiymatlar (barcha job/step'larda mavjud)
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
  SRV: ${{ github.event.inputs.server || github.event.client_payload.server }}
  LOGIN: ${{ github.event.client_payload.login }}

jobs:
  # ==================================================================================================================
  # 1) TEST — jonli progress bilan (bitta xabar bosqichma-bosqich tahrirlanadi).
  # ==================================================================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      result: ${{ steps.pytest.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Maxfiy qiymatlarni yashirish (log)
        env:
          IN_PASSWORD: ${{ github.event.client_payload.password }}
          ONLINE_PASSWORD: ${{ secrets.ONLINE_PASSWORD }}
          XTRADE_PASSWORD: ${{ secrets.XTRADE_PASSWORD }}
        run: |
          for v in "$IN_PASSWORD" "$ONLINE_PASSWORD" "$XTRADE_PASSWORD"; do
            [ -n "$v" ] && echo "::add-mask::$v" || true
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Progress — boshlandi
        run: |
          L="${LOGIN:-default}"
          MSG=$(printf '%s\n' \
            "🧪 <b>Autotest boshlandi</b>" \
            "🌐 ${SRV} · 👤 <code>${L}</code>" \
            "" \
            "⏳ Muhit tayyorlanmoqda…" | python scripts/tg_notify.py send)
          echo "PROGRESS_MSG_ID=$MSG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Progress — kutubxonalar
        if: ${{ always() }}
        run: |
          L="${LOGIN:-default}"
          printf '%s\n' \
            "🧪 <b>Autotest</b>" \
            "🌐 ${SRV} · 👤 <code>${L}</code>" \
            "" \
            "✅ Kutubxonalar o'rnatildi" \
            "🌐 Brauzer o'rnatilmoqda…" | python scripts/tg_notify.py edit "$PROGRESS_MSG_ID"

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Progress — test ketyapti
        if: ${{ always() }}
        run: |
          L="${LOGIN:-default}"
          printf '%s\n' \
            "🧪 <b>Autotest</b>" \
            "🌐 ${SRV} · 👤 <code>${L}</code>" \
            "" \
            "✅ Brauzer tayyor" \
            "🏃 Test ketyapti…" | python scripts/tg_notify.py edit "$PROGRESS_MSG_ID"

      - name: Run tests
        id: pytest
        env:
          HEADLESS: "1"
          IN_SERVER: ${{ github.event.inputs.server || github.event.client_payload.server }}
          IN_LOGIN: ${{ github.event.client_payload.login }}
          IN_PASSWORD: ${{ github.event.client_payload.password }}
          # DEFAULT login/parollar (GitHub Secrets'dan) — config/credentials.py env'dan o'qiydi
          ONLINE_LOGIN: ${{ secrets.ONLINE_LOGIN }}
          ONLINE_PASSWORD: ${{ secrets.ONLINE_PASSWORD }}
          XTRADE_LOGIN: ${{ secrets.XTRADE_LOGIN }}
          XTRADE_PASSWORD: ${{ secrets.XTRADE_PASSWORD }}
        run: |
          set +e
          ARGS=("tests/${IN_SERVER}" "--server" "${IN_SERVER}" "--alluredir=allure-results" "-v")
          [ -n "$IN_LOGIN" ]    && ARGS+=("--email" "$IN_LOGIN")
          [ -n "$IN_PASSWORD" ] && ARGS+=("--password" "$IN_PASSWORD")
          python -m pytest "${ARGS[@]}"
          code=$?
          if [ "$code" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Progress — hisobot
        if: ${{ always() }}
        run: |
          L="${LOGIN:-default}"
          printf '%s\n' \
            "🧪 <b>Autotest</b>" \
            "🌐 ${SRV} · 👤 <code>${L}</code>" \
            "" \
            "✅ Test tugadi" \
            "📊 Hisobot (Allure) tayyorlanmoqda…" | python scripts/tg_notify.py edit "$PROGRESS_MSG_ID"

      - name: Upload allure-results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  # ==================================================================================================================
  # 2) PUBLISH — Allure -> GitHub Pages, batafsil natija bilan progress xabarini yakunlaydi.
  # ==================================================================================================================
  publish:
    needs: test
    # Bekor qilingan (to'xtatilgan) run'da ISHLAMAYDI — yarim natija + 404 yubormaslik uchun.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4          # scripts/ uchun

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        run: npm install -g allure-commandline --silent

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Wait for Allure link (Pages tayyor bo'lsin)
        if: ${{ always() }}
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER_LC}.github.io/${REPO}/reports/${RUN_ID}/"
          echo "Kutilayotgan link: $URL"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "urinish $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Allure link tayyor"; break; }
            sleep 6
          done

      - name: Yakuniy natija (Telegram)
        if: ${{ always() }}
        env:
          RESULT: ${{ needs.test.outputs.result }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          ALLURE_URL="https://${OWNER_LC}.github.io/${REPO}/reports/${RUN_ID}/"
          L="${LOGIN:-default}"
          if [ "$RESULT" = "success" ]; then VERDICT="✅ MUVAFFAQIYATLI"; else VERDICT="❌ XATOLIK BOR"; fi
          SUMMARY=$(python scripts/ci_summary.py allure-results)
          printf '%s\n' \
            "🧪 <b>Autotest tugadi</b> — ${VERDICT}" \
            "🌐 ${SRV} · 👤 <code>${L}</code>" \
            "" \
            "${SUMMARY}" \
            "" \
            "📊 Allure: ${ALLURE_URL}" \
            "🔗 Run: ${RUN_URL}" | python scripts/tg_notify.py send
