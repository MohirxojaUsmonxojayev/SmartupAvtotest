name: E2E (Xarid→Sotuv→Qaytarish→To'lov)

# E2E biznes-sikl zanjiri (tests/xtrade/e2e_xarid_sotuv/, test_01…test_17) — tartibli, bitta
# login sessiyasida. ~15 daqiqa. Har run xtrade'да YANGI ma'lumot yaratadi (rdate bilan unique),
# toza (bo'sh) holatdan boshlanadi (CI checkout'да .e2e-state/ yo'q).
#
# Ishga tushirish:
#  • workflow_dispatch — qo'lda (Actions UI).
#  • schedule — har kuni 02:00 UTC (nightly). Kerak bo'lmasa `schedule` blokini olib tashlang.
#
# DIQQAT: login = XTRADE_LOGIN/XTRADE_PASSWORD secret (default `mohir@xan`). E2E ssenariy shu
# akkaunt ma'lumotlariга tayanadi — secret shu akkauntники bo'lishi SHART.
run-name: "E2E · xtrade · ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Natija yuboriladigan Telegram chat_id (bo'sh = default secret)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 2 * * *"   # har kuni 02:00 UTC

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ==================================================================================================================
  # 1) TEST — E2E zanjiri (tartibli), jonli progress bilan.
  # ==================================================================================================================
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.pytest.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Maxfiy qiymatlarni yashirish (log)
        env:
          XTRADE_PASSWORD: ${{ secrets.XTRADE_PASSWORD }}
        run: |
          [ -n "$XTRADE_PASSWORD" ] && echo "::add-mask::$XTRADE_PASSWORD" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Progress — boshlandi
        run: |
          MSG=$(printf '%s\n' \
            "🔗 <b>E2E zanjiri boshlandi</b>" \
            "🌐 xtrade · Xarid→Sotuv→Qaytarish→To'lov (17 qadam)" \
            "" \
            "⏳ Muhit tayyorlanmoqda…" | python scripts/tg_notify.py send)
          echo "PROGRESS_MSG_ID=$MSG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Progress — test ketyapti
        if: ${{ always() }}
        run: |
          printf '%s\n' \
            "🔗 <b>E2E zanjiri</b>" \
            "🌐 xtrade · 17 qadamli biznes sikli" \
            "" \
            "✅ Brauzer tayyor" \
            "🏃 Zanjir ketyapti (~15 daqiqa)…" | python scripts/tg_notify.py edit "$PROGRESS_MSG_ID"

      - name: Run E2E chain
        id: pytest
        env:
          HEADLESS: "1"
          XTRADE_LOGIN: ${{ secrets.XTRADE_LOGIN }}
          XTRADE_PASSWORD: ${{ secrets.XTRADE_PASSWORD }}
        run: |
          set +e
          python -m pytest tests/xtrade/e2e_xarid_sotuv/ \
            --server xtrade --alluredir=allure-results -p no:cacheprovider -v
          code=$?
          if [ "$code" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          # Yiqilgan run qizil ko'rinsin. Keyingi qadamlar always() bilan baribir ishlaydi.
          exit "$code"

      - name: Progress — hisobot
        if: ${{ always() }}
        run: |
          printf '%s\n' \
            "🔗 <b>E2E zanjiri</b>" \
            "🌐 xtrade · 17 qadamli biznes sikli" \
            "" \
            "✅ Zanjir tugadi" \
            "📊 Hisobot (Allure) tayyorlanmoqda…" | python scripts/tg_notify.py edit "$PROGRESS_MSG_ID"

      - name: Upload allure-results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  # ==================================================================================================================
  # 2) PUBLISH — Allure → GitHub Pages + batafsil yakuniy natija (Telegram).
  # ==================================================================================================================
  publish:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        run: npm install -g allure-commandline --silent

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Wait for Allure link (Pages tayyor bo'lsin)
        if: ${{ always() }}
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER_LC}.github.io/${REPO}/reports/${RUN_ID}/"
          echo "Kutilayotgan link: $URL"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "urinish $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Allure link tayyor"; break; }
            sleep 6
          done

      - name: Yakuniy natija (Telegram)
        if: ${{ always() }}
        env:
          RESULT: ${{ needs.e2e.outputs.result }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          ALLURE_URL="https://${OWNER_LC}.github.io/${REPO}/reports/${RUN_ID}/"
          if [ "$RESULT" = "success" ]; then VERDICT="✅ MUVAFFAQIYATLI (17/17)"; else VERDICT="❌ XATOLIK BOR"; fi
          SUMMARY=$(python scripts/ci_summary.py allure-results)
          printf '%s\n' \
            "🔗 <b>E2E zanjiri tugadi</b> — ${VERDICT}" \
            "🌐 xtrade · Xarid→Sotuv→Qaytarish→To'lov" \
            "" \
            "${SUMMARY}" \
            "" \
            "📊 Allure: ${ALLURE_URL}" \
            "🔗 Run: ${RUN_URL}" | python scripts/tg_notify.py send
