[pytest]
# Online va Xtrade testlarini marker orqali ajratib ishlatish:
#   pytest tests/online              -> faqat online
#   pytest tests/xtrade              -> faqat xtrade
#   pytest -m online                 -> faqat online (marker bo'yicha)
#   pytest -m xtrade                 -> faqat xtrade
markers =
    online: Smartup Online (smartup.online) testlari
    xtrade: Xtrade (app3.greenwhite.uz/xtrade) testlari

addopts = -v -s
